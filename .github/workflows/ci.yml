name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test -p dmd-protocol --test policy --locked

  full:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo build -p dmd --no-default-features --locked

  status:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && 'ci/quick' || 'ci/full' }}
    if: always()
    needs: [quick, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test the decision logic
        run: |
          rustc --edition=2024 -D warnings --test .github/scripts/ci_status.rs -o ci-status-tests
          ./ci-status-tests
      - name: Require explicit success
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          QUICK: ${{ needs.quick.result }}
          FULL: ${{ needs.full.result }}
        run: |
          rustc --edition=2024 -D warnings .github/scripts/ci_status.rs -o ci-status
          ./ci-status "$DRAFT" "$QUICK" "$FULL"
