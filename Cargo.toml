[workspace]
members = ["crates/dmd-protocol", "crates/dmd", "crates/dmd-native", "crates/dmd-core-sys"]
default-members = ["crates/dmd-protocol", "crates/dmd"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde_json = "1.0"
dmd-protocol = { path = "crates/dmd-protocol" }
dmd-native = { path = "crates/dmd-native", default-features = false }
dmd-core-sys = { path = "crates/dmd-core-sys", default-features = false }

[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
undocumented_unsafe_blocks = "deny"
